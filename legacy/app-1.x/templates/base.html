<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Vulpfin Flowboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <script src="https://unpkg.com/htmx.org@1.9.12"></script>
  <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js"></script>
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
  <header class="topbar">
    <h1 style="cursor: pointer;" onClick="js:window.location.href='/';">Vulpfin Flowboard</h1>
    <form hx-post="/plan" hx-target="#plan" hx-swap="innerHTML" onsubmit="if(!this.window.value) this.window.value=480;">
      <input type="number" name="window" placeholder="Window (min)"
            min="15" step="15" value="480"
            title="Time budget for this plan in minutes. Leave blank and we’ll assume a standard 8-hour workday (480 min)." />
      <input type="text" name="start_context" placeholder="Start context (optional)"
            title="Soft bias for the first task’s context (e.g., Excel, Email, Coding). Helps reduce context switching when priorities are close." />
      <button type="submit" title="Compute the best path within the time budget.">Plan</button>
    </form>
    <a href="/ai/logs" class="linkbtn" title="View AI prompts and responses">AI Logs</a>
    <a id="ics-link" class="linkbtn" href="/plan/ics" title="Export the current plan to your calendar">Export ICS</a>
    <a class="linkbtn danger" hx-post="/tasks/clear" hx-target="#board" hx-swap="outerHTML" hx-confirm="Delete ALL tasks (including completed)? This cannot be undone." title="Remove every task and start fresh">Clear All</a>
  </header>
  <main class="wrap">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
