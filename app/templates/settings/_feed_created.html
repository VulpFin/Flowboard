<div class="conn" id="feed-{{ board.id }}">
  <b>{{ board.icon }} {{ board.name }}</b> <span class="tag ok">active</span>
  <div class="flash ok">New feed secret created. Copy it now — it is not shown again.</div>
  <label>Subscribe URL (https) <input readonly value="{{ url }}" onclick="this.select()"></label>
  <label>webcal:// (Apple Calendar / Outlook “Add from Internet”) <input readonly value="{{ webcal }}" onclick="this.select()"></label>
  <p class="muted small">Google Calendar: Other calendars → From URL → paste the https URL. Apple: File → New Calendar Subscription. Outlook: Add calendar → Subscribe from web.</p>
  <form method="post" action="/boards/{{ board_ref }}/feed/revoke"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><button class="danger">Revoke</button></form>
</div>
