{% extends "base.html" %}
{% block title %}Reset password · {{ site_name }}{% endblock %}
{% block content %}
<section class="panel narrow">
  <h2>Reset your password</h2>
  {% if sent %}
  <p>If an account exists for that address, a reset link has been sent. It expires in 60 minutes.</p>
  {% else %}
  <form method="post" action="/password/forgot" class="stack">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <label>Email <input name="email" type="email" required autofocus></label>
    <button type="submit" class="btn primary">Send reset link</button>
  </form>
  {% endif %}
  <p class="muted"><a href="/login">Back to sign in</a></p>
</section>
{% endblock %}
