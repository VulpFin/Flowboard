# Vulpfin Flowboard - primary production vhost (flowboard.fyi)
# Cloudflare proxies this host; TLS at the origin uses a Cloudflare Origin CA
# certificate (only valid between Cloudflare and this server).  Set the zone's
# SSL mode to "Full (strict)".

<VirtualHost *:80>
    ServerName flowboard.fyi
    ServerAlias www.flowboard.fyi
    RewriteEngine On
    # Let ACME http-01 through in case Let's Encrypt is ever used instead of the origin cert
    RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
    RewriteRule ^ https://flowboard.fyi%{REQUEST_URI} [END,NE,R=301]
    ErrorLog ${APACHE_LOG_DIR}/flowboard_fyi_http_error.log
    CustomLog ${APACHE_LOG_DIR}/flowboard_fyi_http_access.log combined
</VirtualHost>

<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName flowboard.fyi
    ServerAlias www.flowboard.fyi

    SSLEngine on
    SSLCertificateFile    /etc/apache2/ssl/flowboard.fyi.pem
    SSLCertificateKeyFile /etc/apache2/ssl/flowboard.fyi.key

    # canonical host: www -> apex
    RewriteEngine On
    RewriteCond %{HTTP_HOST} ^www\.flowboard\.fyi$ [NC]
    RewriteRule ^ https://flowboard.fyi%{REQUEST_URI} [END,NE,R=301]

    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always set Strict-Transport-Security "max-age=31536000"

    # Release download kept from the old vhost
    Alias /download/flowboard.vfa /var/www/Flowboard/releases/flowboard.vfa
    <Directory "/var/www/Flowboard/releases">
        Require all granted
        Options -Indexes
        AddType application/octet-stream .vfa
    </Directory>
    <Location /download/flowboard.vfa>
        Header set Content-Disposition "attachment; filename=flowboard.vfa"
        Header set Cache-Control "public, max-age=86400, immutable"
    </Location>

    # Static assets served by Apache directly
    Alias /static /var/www/Flowboard/app/static
    <Directory "/var/www/Flowboard/app/static">
        Require all granted
        Options -Indexes
        Header set Cache-Control "public, max-age=3600"
    </Directory>

    ProxyPreserveHost On
    ProxyRequests Off
    ProxyTimeout 180
    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Port "443"
    ProxyPass /download !
    ProxyPass /static !
    ProxyPass        / http://127.0.1.1:8000/ connectiontimeout=10 timeout=180
    ProxyPassReverse / http://127.0.1.1:8000/

    ErrorLog ${APACHE_LOG_DIR}/flowboard_fyi_error.log
    CustomLog ${APACHE_LOG_DIR}/flowboard_fyi_access.log combined
</VirtualHost>
</IfModule>
