# Legacy hostname flowboard.vulpfin.com -> permanent redirect to flowboard.fyi
# (path and query string preserved).  Replaces the previous proxy vhost of the
# same file name; the original is kept in /root/backups/flowboard/<ts>/apache/.

<VirtualHost *:80>
    ServerName flowboard.vulpfin.com
    RewriteEngine On
    RewriteRule ^ https://flowboard.fyi%{REQUEST_URI} [END,NE,R=301]
    ErrorLog ${APACHE_LOG_DIR}/flowboard_error.log
    CustomLog ${APACHE_LOG_DIR}/flowboard_access.log combined
</VirtualHost>

<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName flowboard.vulpfin.com
    SSLEngine on
    SSLCertificateFile    /etc/apache2/ssl/vulpfin.com.pem
    SSLCertificateKeyFile /etc/apache2/ssl/vulpfin.com.key
    RewriteEngine On
    RewriteRule ^ https://flowboard.fyi%{REQUEST_URI} [END,NE,R=301]
    ErrorLog ${APACHE_LOG_DIR}/flowboard_error.log
    CustomLog ${APACHE_LOG_DIR}/flowboard_access.log combined
</VirtualHost>
</IfModule>
